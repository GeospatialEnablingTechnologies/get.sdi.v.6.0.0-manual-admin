site_name: GET SDI Portal Admin Manual
site_description: GET SDI Portal v6.2.0 Admin Manual

theme:
  name: material
  language: en
  logo: assets/logo_colored.png
  favicon: assets/favicon.ico

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

  font:
    text: Open Sans,Arial,sans-serif
    code: JetBrains Mono

  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

nav:
  - Home: index.md
  - Access:
    - Login: access/log-in.md
    - Forgot Password: access/forgot-password.md
    - Two-Factor Authentication: access/two-factor-authentication.md
  - User:
    - User Management: user/user-management.md
    - User Settings: user/user-settings.md
  - Geoserver:
    - Geoserver Management: geoserver/geoserver-management.md
  - Workspace:
    - Workspace Management: workspace/workspace-management.md
